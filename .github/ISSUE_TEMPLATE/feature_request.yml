name: Feature request
description: Suggest an improvement to the Ableton integration.
title: "[Feature]: "
body:
  - type: input
    id: device
    attributes:
      label: Device and OS
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe your workflow and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include an example or short video if useful.
    validations:
      required: true
